[project]
name = "tableloom"
version = "0.0.2"
description = "Render tabular data into beautiful, portable HTML."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE.txt"]

authors = [
    { name = "..." }
]

dependencies = [
    "pandas>=2.0",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
    "Topic :: Text Processing :: Markup :: HTML",
]


[project.optional-dependencies]
test = [
    "pytest>=8",
    "ruff>=0.12",
]


[project.urls]
Homepage = "https://github.com/tableloom/tableloom"
Repository = "https://github.com/tableloom/tableloom"
Issues = "https://github.com/tableloom/tableloom/issues"


[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"


[tool.setuptools.packages.find]
where = ["src"]


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
